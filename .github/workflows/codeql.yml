name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript]

    steps:
      - name: Checkout
        uses: asymmetric-effort/actions/actions/checkout@e565630fb74add31f164fc517eff80906801e8aa # v1.0.10-dev

      - name: Initialize CodeQL
        uses: asymmetric-effort/actions/actions/codeql-init@e565630fb74add31f164fc517eff80906801e8aa # v1.0.10-dev
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: asymmetric-effort/actions/actions/codeql-autobuild@b9346f850c6159e6c7d5121f1b54bb378b8220c7 # v1.0.10-dev

      - name: Perform CodeQL Analysis
        uses: asymmetric-effort/actions/actions/codeql-analyze@e565630fb74add31f164fc517eff80906801e8aa # v1.0.10-dev
        with:
          category: "/language:${{ matrix.language }}"
